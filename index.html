<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            /* Background berulang */
            background-image: url('https://nafiszain90-gif.github.io/asas/batiksmk.png');
            background-repeat: repeat; 
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Styling Menu Tombol */
        .menu-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }

        .btn-soal {
            background-color: #4CAF50; /* Warna hijau */
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
            cursor: pointer;
            border: none;
        }

        .btn-soal:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        .btn-soal:active {
            transform: translateY(0);
        }

        /* Styling Bingkai / Frame Form */
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 800px;
            height: 750px; /* Tinggi bingkai soal */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- MENU TOMBOL SOAL -->
    <div class="menu-container">
        <!-- Kuncinya ada di target="bingkai-soal" -->
        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vRYlXNyMd_vt9-TR_K3xDS9inrPr0T2UW1ApS3d_TiJ1WXiv9qH2RfeiOMjFdvAbnTFeiYYHncGTnGr/pubhtml?gid=0&single=true" target="bingkai-soal" class="btn-soal">DAFTAR DUDI DAN MURID</a>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScrFP06wvTYY97or6D_xHx4DvbG-JrCeEIIYJRH4PSWw2Djiw/viewform" target="bingkai-soal" class="btn-soal">INPUT LAPORAN</a>

        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vRYlXNyMd_vt9-TR_K3xDS9inrPr0T2UW1ApS3d_TiJ1WXiv9qH2RfeiOMjFdvAbnTFeiYYHncGTnGr/pubhtml?gid=1110220474&single=true" target="bingkai-soal" class="btn-soal">PROGRES LAPORAN</a>
    </div>

    <!-- BINGKAI UTAMA -->
    <div class="form-container">
        <!-- src di bawah ini adalah form default yang muncul pertama kali sebelum tombol diklik -->
        <iframe name="bingkai-soal" src="URL_GOOGLE_FORM_SOAL_1">
            Memuat…
        </iframe>
    </div>

</body>
</html>
